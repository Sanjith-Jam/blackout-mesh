name: API contract

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-ml.txt
      - run: python -m pip install pytest
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run check-client
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: PYTHONPATH=backend python -m pytest backend/tests/test_frontend_contract.py -q
      - run: npm run build && npm run test:contract && npm test
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
