[env:esp32-a]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
platform_packages = platformio/framework-arduinoespressif32@4.20017.260907+sha.dcc1105b
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@7.4.3
  miguelbalboa/MFRC522@1.4.12
build_flags = -Wall -Wextra -DMFRC522_SPICLOCK=1000000

[env:esp32-a-enroll]
extends = env:esp32-a
build_flags = ${env:esp32-a.build_flags} -DENROLLMENT_MODE
